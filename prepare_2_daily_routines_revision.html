lt\": \"Routine illustration\"}, {\"word\": \"watch\", \"text\": \"_____ a film\", \"full\": \"watch a film\", \"alt\": \"Routine illustration\"}, {\"word\": \"bath\", \"text\": \"have a _____\", \"full\": \"have a bath\", \"alt\": \"Routine illustration\"}, {\"word\": \"shower\", \"text\": \"have a _____\", \"full\": \"have a shower\", \"alt\": \"Routine illustration\"}, {\"word\": \"ready\", \"text\": \"get _____ for school\", \"full\": \"get ready for school\", \"alt\": \"Routine illustration\"}, {\"word\": \"school\", \"text\": \"go to _____\", \"full\": \"go to school\", \"alt\": \"Routine illustration\"}, {\"word\": \"video\", \"text\": \"play _____ games\", \"full\": \"play video games\", \"alt\": \"Routine illustration\"}, {\"word\": \"bed\", \"text\": \"go to _____\", \"full\": \"go to bed\", \"alt\": \"Routine illustration\"}]\n};\nGAME.items.forEach((item,i)=>item.image=parent.routineImages[i]);\nconst vocabulary=GAME.items.map(item=>[item.word,item.text||'']);\nconst normalizedWord=word=>word.replace(/[\\s\u2019'\\-]/g,'').toUpperCase();\nconst N=Math.max(GAME.minimumGridSize,...vocabulary.map(v=>normalizedWord(v[0]).length));let board,words,first,pending,solved,order;let dragging=false,trail=[];const LIMIT=GAME.timeLimitSeconds;let deadline=null,ticker=null,remaining=LIMIT,ended=false;let lives=GAME.startingLives;\nconst grid=document.querySelector('#grid'),definitions=document.querySelector('#definitions'),message=document.querySelector('#message');\nconst wordPalette = [\n  '#f8c1cc', '#b8e2fc', '#f9dda0', '#ccbef6', '#a9e4c7',\n  '#ffc5a8', '#b3d4fe', '#dbe99b', '#eac0f0', '#a8e1e1',\n  '#f3c0a5', '#c4cffa', '#ecd0a4', '#f3afd1', '#bcdcb1',\n];\nconst wordInk = [\n  '#aa2851', '#15619a', '#805309', '#6344a6', '#21694c',\n  '#a34523', '#3158a5', '#546b18', '#853593', '#126868',\n  '#953d29', '#4a51a1', '#765221', '#a1296c', '#396738',\n];\nconst wordColor = id => wordPalette[id % wordPalette.length];\nconst wordAccent = id => wordInk[id % wordInk.leng let times=['in the morning','in the afternoon','in the evening','at night','any time'];let selected=null;function routineTile(i){return `<button class="routineTile ${selected===i?'active':''}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="selected=${i};sorter()" aria-label="${D[i][0]}">${img(i)}</button>`}function dropRoutine(e,k){e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(ids.includes(i))assign(i,k)}function place(k){if(selected!==null)assign(selected,k)}function sorter(){A.innerHTML=`<h2>When do you do these activities?</h2><p>Drag the pictures or select a picture and click a column.</p><p><b>I wake up in the morning. I play video games at night.</b></p><div class="sort">${times.map((t,k)=>`<div class="bucket" ondragover="event.preventDefault()" ondrop="dropRoutine(event,${k})"><button class="buckethead" onclick="place(${k})">${['🌅','☀️','🌇','🌙','🔄'][k]}<br>${t}</button><div class="buckettiles">${ids.filter(i=>sorted[i]===k).map(routineTile).join('')}</div></div>`).join('')}</div><div class="bank" ondragover="event.preventDefault()" ondrop="dropRoutine(event,-1)"><button onclick="place(-1)">Picture bank</button> ${btn('Reset','sorted={};selected=null;sorter()')}<div class="banktiles">${ids.filter(i=>sorted[i]===undefined).map(routineTile).join('')}</div></div>`}function assign(i,k){if(k===-1)delete sorted[i];else sorted[i]=k;selected=null;M.textContent=k===-1?'':'I '+D[i][0]+' '+times[k]+'.';sorter()}function card(reveal){if(pos===order.length){A.innerHTML=`<h2>Final score: ${score} / 19</h2>${btn('Play again','openPage(4)')}`;return}let i=order[pos];A.innerHTML=`<div class="center"><h2>Say the phrase</h2><p>Card ${pos+1} / 19 · Score ${score}</p><progress value="${pos}" max="19"></progress><div class="definitionCard"><h2>${D[i][1]}</h2>${reveal?`<div class="hero">${img(i).replace('<img','<img style="width:100%"')}</div><h2>${D[i][0]}</h2>`:btn('Reveal answer','card(true)')}</div><div class="b function login(){const name=prompt('Enter your student name or code',student);if(!name||!name.trim())return;student=name.trim().slice(0,80);try{localStorage.setItem(key,student)}catch(e){}loadResults();profile();openPage(0)}
function profile(){document.getElementById('studentLabel').textContent=student?'Student: '+student:'Guest';}
const oldMatch=match;match=function(){oldMatch();if(done.length){const sets=results.match||{};sets[set]=Math.max(sets[set]||0,done.length);record('match',sets)}};
const oldSpell=spellAdvance;spellAdvance=function(skip){const before=pos;oldSpell(skip);if(pos!==before)record('spelling',{correct:spellCorrect,skipped:spellSkipped,points:spellPoints,answered:pos})};
const oldAssign=assign;assign=function(i,k){oldAssign(i,k);record('sorter',Object.keys(sorted).length)};
const oldCard=card;card=function(reveal){oldCard(reveal);if(pos>0)record('definition',{correct:score,answered:pos})};
window.addEventListener('message',e=>{const frame=A.querySelector('iframe');if(frame&&e.source===frame.contentWindow&&e.data?.type==='routine-results'&&e.data.count>0)record('search',e.data.count)});
function report(){return ['Prepare 2 – Daily Routines Revision','Student: '+(student||'Guest'),'Date: '+new Date().toLocaleString(),'Triple Match: '+Object.values(results.match||{}).reduce((a,b)=>a+b,0)+' / 19','Spelling: '+(results.spelling?results.spelling.correct+' correct, '+results.spelling.skipped+' skipped, '+results.spelling.points+' points':'Not started'),'Word Search: '+(results.search||0)+' / 19','Sorter: '+(results.sorter||0)+' / 19 placed (not graded)','Definition Game: '+(results.definition?results.definition.correct+' correct / '+results.definition.answered+' answered (self-assessed)':'Not started')].join('\n')}
function showResults(){if(!student){login();if(!student)return}page=5;nav();M.textContent='';A.innerHTML='<h2>My results</h2><p>Saved on this device. Submit Results prepares a report to share with your teacher.</p><pre id="reportText" style="white-space:pre-wrap;overflow-wrap:anywhere;font:inherit"></pre><button onclick="submitResults()">Submit Results</button><div id="submitOptions" hidden><p>Copy or download your report and send it to your teacher. It is not sent automatically.</p><button onclick="copyReport()">Copy report</button> <button onclick="downloadReport()">Download report</button></div>';document.getElementById('reportText').textContent=report()}
function submitResults(){save();document.getElementById('submitOptions').hidden=false}
async function copyReport(){try{await navigator.clipboard.writeText(report());M.textContent='Report copied.'}catch(e){M.textContent='Select and copy the report above.'}}
function downloadReport(){const url=URL.createObjectURL(new Blob([report()],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='daily-routines-results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
loadResults();profile();openPage(0);
</script></html>
