<script>
'use strict';
const bank=JSON.parse(document.getElementById('bank-data').textContent);
const $=id=>document.getElementById(id);
const escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ids=bank.map((_,i)=>i);
const names={match:'Triple Match',spell:'Spelling',search:'Word Search',sort:'Free Sorter',definition:'Definition Game',blast:'Blast',results:'Results'};
const assessment={match:'Automatic',spell:'Automatic',search:'Automatic',sort:'Unscored',definition:'Self- or teacher-assessed',blast:'Automatic · game points'};
const storage='emotions-vocabulary-a2-v1';
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{$('notice').textContent='Browser storage is unavailable. Results are available during this session.'}}
let student=read(storage+':student',''), page='match', state={}, cache={};
const key=()=>storage+':student:'+student;
function records(){return cache[student]??=read(key(),{})}
function save(activity,data){records()[activity]={student,trainer:'Emotions A2',activity:names[activity],assessment:assessment[activity],date:new Date().toISOString(),...data};write(key(),records())}
function summary(activity,score,max,extra={}){const start=state[activity]?.start;save(activity,{complete:true,score,max,...(start?{seconds:Math.round((Date.now()-start)/1000)}:{}),...extra})}
function image(id,cls=''){return '<img class="emoji '+cls+'" src="'+bank[id].image+'" alt="" draggable="false">'}
const button=(label,action,cls='',disabled=false,attrs='')=>'<button type="button" data-action="'+action+'" class="'+cls+'" '+(disabled?'disabled ':'')+attrs+'>'+label+'</button>';
const bar=(left,right='')=>'<div class="bar"><span>'+left+'</span><span>'+right+'</span></div>';
const status=text=>'<div class="status" role="status">'+text+'</div>';
const replay=()=>button('Restart','reset');
const groups=[ids.slice(0,4),ids.slice(4,8),ids.slice(8)];
function derange(list,base){const a=shuffle(list);for(let i=0;i<a.length;i++)if(a[i]===base[i]){const j=(i+1)%a.length;[a[i],a[j]]=[a[j],a[i]]}return a}
function matchRound(g){const p=shuffle(groups[g]);return {columns:[p,derange(p,p),derange(p,p)],done:[],active:null,step:0,message:'',errors:0}}
function makeMatch(){return {start:Date.now(),g:0,rounds:groups.map((_,i)=>matchRound(i))}}
function matching(s){const r=s.rounds[s.g],total=s.rounds.reduce((n,x)=>n+x.done.length,0);return bar('Match the word, definition and picture. <strong>'+total+'/'+ids.length+'</strong>',groups.map((_,i)=>button('Set '+(i+1),'set-'+i,i===s.g?'active':'')).join(' ')+ ' '+replay())+'<div class="match" data-count="'+r.columns[0].length+'">'+r.columns.map((col,k)=>'<div style="display:contents">'+col.map((id,i)=>{const done=r.done.includes(id), selected=r.active===id&&(k===0||k===1&&r.step===2);return '<div style="grid-row:'+(i+1)+';grid-column:'+(k+1)+';display:grid">'+button(k===0?bank[id].phrase:k===1?escapeHtml(bank[id].definition):image(id),'m-'+k+'-'+id,(k===0?'word ':k===1?'definition ':'')+(done?'done':selected?'selected':''),done||k>r.step,'aria-label="'+(k===2?'Picture '+(i+1):escapeHtml(k===0?bank[id].phrase:bank[id].definition))+'"')+'</div>'}).join('')+'</div>').join('')+'</div>'+status(r.message||(r.done.length===groups[s.g].length?'Set complete. Choose another set.':'Choose a word first.'))}
function onMatch(s,a){if(a.startsWith('set-')){s.g=+a.slice(4);return}const [,col,id]=a.split('-').map(Number),r=s.rounds[s.g];if(col===0){r.active=id;r.step=1;r.message='Choose its definition.'}else if(id!==r.active){r.errors++;r.message='Try again.'}else if(col===1){r.step=2;r.message='Now choose its picture.'}else{r.done.push(id);r.active=null;r.step=0;r.message=r.done.length===groups[s.g].length?'Set complete. Choose another set.':'Correct! Choose another word.';if(s.rounds.every((x,i)=>x.done.length===groups[i].length)){r.message='All sets complete!';summary('match',ids.length,ids.length,{correct:ids.length,attempts:ids.length*2+s.rounds.reduce((n,x)=>n+x.errors,0)})}}}
function makeSpell(){return {start:Date.now(),order:shuffle(ids),i:0,score:0,correct:0,skipped:[],errors:0,chosen:[],ready:false}}
const maxSpell=bank.reduce((n,x)=>n+x.target.length+2,0);
function spelling(s){if(s.i===ids.length)return bar('Spelling complete',replay())+'<p class="prompt">Score '+s.score+' / '+maxSpell+'</p><p>Correct '+s.correct+' · Skipped '+s.skipped.length+'</p>';const id=s.order[s.i],x=bank[id];s.letters??=shuffle([...x.target.toUpperCase()]);return bar('Word '+(s.i+1)+' / '+ids.length+' · Score '+s.score+' · Up to +'+(x.target.length+2),replay())+'<div class="center">'+image(id,'hero')+'<p class="prompt">'+escapeHtml(x.prefix)+' <span class="slots '+(s.ready?'good':'')+'">'+s.letters.map((_,i)=>'<span class="slot">'+(s.chosen[i]===undefined?'&nbsp;':s.letters[s.chosen[i]])+'</span>').join('')+'</span> '+escapeHtml(x.suffix)+'</p><div class="tiles">'+s.letters.map((l,i)=>button(l,'letter-'+i,'letter',s.chosen.includes(i)||s.ready||s.chosen.length===s.letters.length)).join('')+'</div><div class="tiles">'+button('Undo','undo','',s.ready||!s.chosen.length)+button('Clear letters','clear','',s.ready||!s.chosen.length)+(s.ready?button('Next','next','primary'):button('Skip','skip'))+'</div>'+status(s.ready?'Correct!':s.chosen.length===s.letters.length?'Try again. You can undo or clear the letters.':'Tap the letters in order.')+'</div>'}
function onSpell(s,a){const x=bank[s.order[s.i]];if(a.startsWith('letter-')){s.chosen.push(+a.slice(7));if(s.chosen.length===x.target.length){s.ready=s.chosen.map(i=>s.letters[i]).join('')===x.target.toUpperCase();if(!s.ready)s.errors++}}else if(a==='undo')s.chosen.pop();else if(a==='clear')s.chosen=[];else if(a==='next'||a==='skip'){if(a==='next'){s.score+=x.target.length+2;s.correct++}else{s.score--;s.skipped.push(x.phrase)}s.i++;s.ready=false;s.chosen=[];s.letters=null;if(s.i===ids.length)summary('spell',s.score,maxSpell,{correct:s.correct,skipped:s.skipped,incorrect:s.errors,attempts:s.correct+s.errors})}}
const zones=['In class','Before school','After school','At basketball','Any time'];
function makeSort(){return {start:Date.now(),places:ids.map(()=>zones.length),pick:null}}
function sorter(s){const zone=(name,z)=>'<div class="zone '+(z===zones.length?'bank':'')+'" data-zone="'+z+'">'+button(name,'zone-'+z,'',s.pick===null)+ids.filter(id=>s.places[id]===z).map(id=>button(image(id),'pick-'+id,'pic '+(s.pick===id?'active':''),false,'draggable="true" aria-label="Picture '+(id+1)+'"')).join('')+'</div>';return bar('Move each picture to a place. Say a sentence.',replay())+'<p>I feel nervous before school.</p><div class="sort">'+zones.map(zone).join('')+'</div>'+zone('Picture bank',zones.length)+status(s.pick===null?'Drag a picture or tap it to choose.':'Tap a heading to move the picture.')+button('Finish sorting','finish','primary')}
function movePicture(s,id,z){if(!ids.includes(id))return;s.places[id]=z;s.pick=null}
function makeDefinition(){return {start:Date.now(),order:shuffle(ids),i:0,score:0,missed:[],reveal:false}}
function definition(s){if(s.i===ids.length)return bar('Definition Game complete',replay())+'<p class="prompt">Score '+s.score+' / '+ids.length+'</p>';const id=s.order[s.i];return bar('Say the word. · Card '+(s.i+1)+'/'+ids.length+' · Score '+s.score,replay())+'<div class="center"><p class="prompt">'+escapeHtml(bank[id].definition)+'</p>'+(s.reveal?image(id,'hero')+'<p class="prompt">'+bank[id].phrase+'</p><div class="tiles">'+button('Correct','correct','primary')+button('Incorrect','incorrect')+'</div>':button('Reveal answer','reveal','primary'))+'</div>'}
function onDefinition(s,a){if(a==='reveal')s.reveal=true;else if(a==='correct'||a==='incorrect'){if(a==='correct')s.score++;else s.missed.push(bank[s.order[s.i]].phrase);s.reveal=false;s.i++;if(s.i===ids.length)summary('definition',s.score,ids.length,{correct:s.score,incorrect:s.missed,attempts:ids.length})}}
const creators={match:makeMatch,spell:makeSpell,sort:makeSort,definition:makeDefinition};
const modules={match:matching,spell:spelling,sort:sorter,definition};
function report(){return ['Emotions A2 · Vocabulary Revision','Student: '+(student||'Guest'),...Object.keys(assessment).map(a=>{const item=records()[a];return names[a]+': '+(item?JSON.stringify(item):'Not completed')})].join('\n')}
function results(){return bar('Results · '+escapeHtml(student||'Guest'),button('Copy Report','copy')+' '+button('Download Report','download'))+'<div class="results">'+Object.keys(assessment).map(a=>{const r=records()[a];return '<div class="result"><strong>'+names[a]+'</strong> · '+assessment[a]+'<br>'+(r?(r.complete?'Completed':'Round ended')+(r.score==null?'':' · Score '+r.score+(r.max==null?'':' / '+r.max))+(r.skipped?.length?' · Skipped '+escapeHtml(r.skipped.join(', ')):'')+' · '+new Date(r.date).toLocaleDateString():'Not completed')+'</div>'}).join('')+'</div>'+status('Copy or download your report to share it.')}
const frames={};
function frameSource(id){
const source=new TextDecoder().decode(Uint8Array.from(atob($(id+'-source').content.textContent.trim()),c=>c.charCodeAt(0)));
const data=id==='search'?bank.map(x=>({word:x.target,text:[x.prefix,'____',x.suffix].filter(Boolean).join(' '),phrase:x.phrase,image:x.image,alt:'Emotion picture'})):bank.map(x=>[x.phrase,x.example]);
return source.replace('__FRAME_DATA__',()=>JSON.stringify(data).replaceAll('<','\\u003c'));
}
function fit(){const view=$('view'),match=view.querySelector('.match');const top=view.getBoundingClientRect().top;view.style.setProperty('--frame',Math.max(255,innerHeight-top-10)+'px');if(match){const n=+match.dataset.count;match.style.setProperty('--card',Math.min(140,Math.max(innerWidth<480?78:57,Math.floor((innerHeight-match.getBoundingClientRect().top-41-(n-1)*6)/n)))+'px')}}
function render(){for(const b of $('nav').children){const active=b.dataset.page===page;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'page':'false')}
const view=$('view');for(const child of view.children)child.hidden=true;
if(page==='search'||page==='blast'){if(!frames[page]){const f=document.createElement('iframe');f.className='frame';f.title=names[page];f.srcdoc=frameSource(page);view.append(f);frames[page]=f}frames[page].hidden=false}
else{let panel=$('panel');if(!panel){panel=document.createElement('div');panel.id='panel';panel.className='panel';view.append(panel)}panel.hidden=false;panel.innerHTML=page==='results'?results():modules[page](state[page]??=creators[page]())}fit()}
document.documentElement.classList.toggle('embed',window.self!==window.top||new URLSearchParams(location.search).get('embed')==='1');
$('nav').innerHTML=Object.entries(names).map(([id,name])=>'<button data-page="'+id+'">'+name+'</button>').join('');
$('nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};
$('student').value=student;
$('student').onchange=e=>{const next=e.target.value.trim();if(next===student)return;student=next;write(storage+':student',student);state={};Object.keys(frames).forEach(k=>{frames[k].remove();delete frames[k]});render()};
$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});else document.documentElement.requestFullscreen?.().catch(()=>{$('notice').textContent='Fullscreen is unavailable in this embed.'})};
$('view').onclick=async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(page==='results'){if(a==='copy'){try{await navigator.clipboard.writeText(report());$('notice').textContent='Report copied.'}catch{const t=document.createElement('textarea');t.value=report();b.after(t);t.select();if(document.execCommand('copy')){t.remove();$('notice').textContent='Report copied.'}else $('notice').textContent='Select and copy the report below.'}}else if(a==='download'){const url=URL.createObjectURL(new Blob([report()],{type:'text/plain'}));const link=document.createElement('a');link.href=url;link.download='Emotions-A2-results.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}return}
if(a==='reset'){state[page]=creators[page]();render();return}
const s=state[page];if(page==='match')onMatch(s,a);if(page==='spell')onSpell(s,a);if(page==='definition')onDefinition(s,a);
if(page==='sort'){if(a.startsWith('pick-'))s.pick=+a.slice(5);if(a.startsWith('zone-')&&s.pick!==null)movePicture(s,s.pick,+a.slice(5));if(a==='finish'){summary('sort',null,null,{placed:s.places.filter(z=>z!==zones.length).length});$('notice').textContent='Sorting result saved.'}}
render();$('view').querySelector('[data-action="'+a+'"]:not(:disabled)')?.focus({preventScroll:true})};
$('view').ondragstart=e=>{const b=e.target.closest('.pic');if(page==='sort'&&b)e.dataTransfer.setData('text/plain',b.dataset.action.slice(5))};
$('view').ondragover=e=>{if(page==='sort'&&e.target.closest('[data-zone]'))e.preventDefault()};
$('view').ondrop=e=>{const z=e.target.closest('[data-zone]');const raw=e.dataTransfer.getData('text/plain');if(page==='sort'&&z&&/^\d+$/.test(raw)){e.preventDefault();movePicture(state.sort,+raw,+z.dataset.zone);render()}};
window.addEventListener('message',e=>{for(const a of ['search','blast']){if(frames[a]?.contentWindow===e.source&&e.data?.emotions===a){const {emotions,...result}=e.data;save(a,result)}}});
window.addEventListener('resize',fit);render();
</script></body></html>
