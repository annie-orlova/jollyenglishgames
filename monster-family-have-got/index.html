*{box-sizing:border-box}body{margin:0;background:#f3efff;color:#292044;font-family:"Trebuchet MS",Arial,sans-serif}main{max-width:1120px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(25px,4vw,38px);margin:8px 0;color:#6737bd}button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:16px;padding:16px 23px;background:#e9e0ff;color:#422479;min-height:54px}button:focus-visible{outline:4px solid #f0aa00;outline-offset:3px}button:disabled{opacity:.4;cursor:default}nav{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}nav button{flex:1}nav .active,.primary{background:#7142cd;color:white}.panel{background:white;border-radius:26px;padding:24px;box-shadow:0 8px 0 #e5ddf3}h2{margin:0 0 8px;font-size:28px}.instruction{font-size:19px;color:#665b7a;margin:8px 0 18px}.layout{display:grid;grid-template-columns:40% 60%;align-items:center}.pictures{display:flex;justify-content:center;align-items:center;height:300px}.pictures img{width:100%;height:100%;object-fit:contain}.pictures.pair img{width:50%}.pronoun{display:block;text-align:center;font-size:32px;font-weight:bold;color:#087e91;margin:8px}.sentence{min-height:90px;padding:15px;border:3px dashed #d5c1f6;border-radius:18px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.words{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.words button{font-size:26px;background:#fff0bd;color:#654600;box-shadow:0 4px 0 #e7cc77}.sentence button{font-size:25px;padding:10px 15px;background:#dff6ee;color:#146b52}.actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}.feedback{min-height:56px;font-size:23px;font-weight:bold;text-align:center;padding:12px}.good{color:#16744b}.bad{color:#a84338}.progress{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:16px}.track{height:9px;border-radius:9px;background:#eae4f4;overflow:hidden;margin-bottom:20px}.track div{height:100%;background:#a47ae6;transition:width .3s}.bins{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.bin{background:#edf9fb;border:3px solid #9ed9e0;border-radius:20px;min-height:130px;padding:15px;text-align:center}.bin:nth-child(2){background:#fff0f7;border-color:#f1add0}.bin h3{font-size:29px;margin:0 0 12px}.bin button{width:100%;background:#087e91;color:white}.bin:nth-child(2) button{background:#bb4082}.sorted{font-size:17px;margin:8px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#faf7ff;border:3px solid #e9dff8;text-align:left;font-size:24px}.card.selected{border-color:#8150d0;background:#f0e5ff}.subject{color:#007e92;font-weight:bold}.card.selected .subject{color:#5c29a6}.quizPrompt{text-align:center;font-size:29px;margin:16px}.choices{display:grid;gap:12px}.choices button{text-align:left;font-size:25px;background:#f0e8ff;border:3px solid transparent}.choices button.correct{background:#dff6e9;border-color:#52b385}.choices button.wrong{background:#fff0eb;border-color:#de9e89}.finish{text-align:center;padding:30px;font-size:23px}.finish h2{font-size:38px}footer{font-size:12px;text-align:center;color:#71677d;padding:20px} @media(max-width:700px){main{padding:12px}.panel{padding:18px}.layout{grid-template-columns:1fr}.pictures{height:240px}.cards{grid-template-columns:1fr}.bins{gap:8px}.bin{padding:10px}.bin h3{font-size:24px}.words button{font-size:23px}header{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.sort-buddy{display:flex;align-items:center;justify-content:center;gap:15px;margin:5px 0 18px;min-height:130px}
.sort-buddy img{height:120px;width:120px;object-fit:contain;transform-origin:bottom}
.buddy-message{font-size:22px;font-weight:bold;color:#67449a;min-width:190px}
.sort-buddy.happy img{animation:monsterJump .65s ease}
.sort-buddy.sad img{animation:monsterSad .6s ease;filter:saturate(.45);transform:rotate(-8deg) translateY(7px)}
@keyframes monsterJump{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(0) scale(1.08,.88)}55%{transform:translateY(-30px) rotate(8deg)}80%{transform:translateY(0) scale(1.1,.9)}}
@keyframes monsterSad{0%,100%{transform:rotate(-8deg) translateY(7px)}35%{transform:rotate(-14deg) translateX(-5px)}70%{transform:rotate(-3deg) translateX(5px)}}
@media(prefers-reduced-motion:reduce){.sort-buddy.happy img,.sort-buddy.sad img{animation:none}}

.bubble-sentence{font-size:clamp(30px,4vw,49px);font-weight:bold;text-align:center;margin:25px 0;color:#43266e}
.bubble-field{height:425px;position:relative;overflow:hidden;background:linear-gradient(#f1faff,#faf4ff);border-radius:25px;border:2px solid #e0d7f1}
.bubble{position:absolute;width:clamp(116px,18vw,178px);height:clamp(116px,18vw,178px);padding:5px;border-radius:50%;font-size:clamp(27px,3vw,39px);border:3px solid #c6a0ec;color:#422469;background:radial-gradient(circle at 30% 25%,white,#ede0ff 55%,#cdb0f0);box-shadow:inset -8px -9px 15px #b085d633,0 8px 15px #7954a51a;animation:floatBubble 4.2s ease-in-out infinite}
.bubble:nth-child(2){background:radial-gradient(circle at 30% 25%,white,#d8f4fb 55%,#a0dce8);border-color:#86cad9;animation-delay:-1.2s}
.bubble:nth-child(3){background:radial-gradient(circle at 30% 25%,white,#ffe6ef 55%,#f4b6cf);border-color:#edacc6;animation-delay:-2.5s}
.bubble:nth-child(4){background:radial-gradient(circle at 30% 25%,white,#fff1bd 55%,#efd883);border-color:#e2ca78;animation-delay:-3.4s}
.bubble.popped{animation:popBubble .35s ease-out forwards;pointer-events:none}
.bubble.missed{border:5px solid #b84a49;opacity:.55}
.star-counter{text-align:center;font-size:28px;color:#775019;font-weight:bold}
.star-strip{min-height:48px;text-align:center;font-size:30px;letter-spacing:5px;overflow-wrap:anywhere}
@keyframes floatBubble{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(10px,-24px) rotate(5deg)}}
@keyframes popBubble{to{transform:scale(1.55);opacity:0}}
@media(max-width:600px){.bubble-field{height:390px}.bubble{width:125px;height:125px}.star-counter{font-size:24px}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none}.bubble.popped{opacity:0}}

.bubble-field{height:390px}
.bubble{width:128px;height:128px;font-size:31px;animation:none}
.bubble:disabled{opacity:1}
.bubble.missed{opacity:.5}
.bubble.popped{animation:popBubble .35s ease-out forwards}
@media(max-width:600px){.bubble-field{height:390px}.bubble{width:102px;height:102px;font-size:25px}}
.target-form{color:#168044}.bubble{color:#168044;font-size:25px}.bubble:disabled{color:#168044}@media(max-width:600px){.bubble{font-size:21px}}</style>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const shortForms={I:"I've",You:"You've",He:"He's",She:"She's",It:"It's",We:"We've",They:"They've"};

let bubbleStars=0;
let bubbleFrame=null;
let sortReactionTimer;
let stage=0,index=0,chosen=[],pool=[],solved=false,selected=null,placements={},quizOrder=[];
const app=document.querySelector('#app');
function picture(q){return '<div><div class="pictures '+(q.a.length>1?'pair':'')+'">'+q.a.map(i=>'<img src="'+images[i]+'" alt="'+['Little Monster','Sister monster','Brother monster','Mother monster'][i]+'">').join('')+'</div><span class="pronoun">'+q.p+'</span></div>'}
function feedback(text,ok=false){let f=document.querySelector('#feedback');f.textContent=text;f.className='feedback '+(ok?'good':'bad')}
function start(s){cancelAnimationFrame(bubbleFrame);clearTimeout(sortReactionTimer);stage=s;index=0;bubbleStars=0;chosen=[];placements={};selected=null;solved=false;prepare();render()}
function prepare(){chosen=[];solved=false;if(stage===0){let original=build[index].parts;do{pool=shuffle(original.map((text,id)=>({text,id})))}while(pool.every((x,i)=>x.id===i))}if(stage===2)quizOrder=shuffle([0,1,2])}
function renderHeader(title,instruction,n,total){return '<div class="progress"><span>'+title+'</span><span>'+n+' / '+total+'</span></div><div class="track"><div style="width:'+((n-1)/total*100)+'%"></div></div><h2>'+title+'</h2><p class="instruction">'+instruction+'</p>'}
function render(){
document.querySelectorAll('[data-stage]').forEach(b=>{b.classList.toggle('active',+b.dataset.stage===stage);b.setAttribute('aria-current',+b.dataset.stage===stage?'step':'false')});
if(stage===0)renderBuild();if(stage===1)renderSort();if(stage===2)renderQuiz();if(stage===3)renderBubbles();
}
function renderBuild(){
let q=build[index];app.innerHTML=renderHeader('Build a sentence','Click the chunks in order. Click a chosen chunk to put it back.',index+1,build.length)+'<div class="layout">'+picture(q)+'<div><div class="sentence" id="answer" aria-label="Your sentence"></div><div class="words" id="words"></div><div class="actions"><button id="clear">Clear</button><button class="primary" id="check">Check ✓</button></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="primary" id="next" hidden>Next →</button></div></div></div>';
drawWords();document.querySelector('#clear').onclick=()=>{chosen=[];solved=false;drawWords();feedback('');document.querySelector('#next').hidden=true};
document.querySelector('#check').onclick=()=>{if(chosen.length!==pool.length){feedback('Use all the chunks.');return}let good=chosen.every((id,i)=>pool.find(x=>x.id===id).text===q.parts[i]);if(good){solved=true;drawWords();feedback('Great! Say your sentence aloud.',true);document.querySelector('#next').hidden=false}else feedback('Try again. Check who the sentence is about.')};
document.querySelector('#next').onclick=()=>{if(index+1===build.length){finish('Sentence builder complete!',1);return}index++;prepare();render()};
}
function drawWords(){let make=(item,inAnswer)=>{let b=document.createElement('button');b.textContent=item.text;b.disabled=solved;b.onclick=()=>{if(inAnswer)chosen=chosen.filter(id=>id!==item.id);else chosen.push(item.id);drawWords();feedback('')};return b};let a=document.querySelector('#answer'),w=document.querySelector('#words');a.replaceChildren(...chosen.map(id=>make(pool.find(x=>x.id===id),true)));w.replaceChildren(...pool.filter(x=>!chosen.includes(x.id)).map(x=>make(x,false)))}
function reactMonster(good){
const buddy=document.querySelector('#sortBuddy');
buddy.className='sort-buddy '+(good?'happy':'sad');

}

document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{selected=+b.dataset.card;renderSort()});

y:Math.max(0,(field.clientHeight-el.offsetHeight)*([.05,.15,.8,.85][i])),
vx:(i%2? -1:1)*(50+Math.random()*24),
vy:(i<2?1:-1)*(36+Math.random()*22)
}));
let last=null;
function move(now){
const dt=last===null?0:Math.min((now-last)/1000,.04);last=now;
states.forEach(b=>{
const maxX=Math.max(0,field.clientWidth-b.el.offsetWidth);
const maxY=Math.max(0,field.clientHeight-b.el.offsetHeight);
b.x+=b.vx*dt;b.y+=b.vy*dt;
if(b.x<=0||b.x>=maxX){b.vx*=-1;b.x=Math.max(0,Math.min(maxX,b.x))}
if(b.y<=0||b.y>=maxY){b.vy*=-1;b.y=Math.max(0,Math.min(maxY,b.y))}
b.el.style.left=b.x+'px';b.el.style.top=b.y+'px';
});
if(stage===3&&!solved)bubbleFrame=requestAnimationFrame(move);
}
bubbleFrame=requestAnimationFrame(move);
}

function renderBubbles(){
cancelAnimationFrame(bubbleFrame);
const q=bubbleQuestions[index],answer=shortForms[q[0]]+' got';
const alternatives=shuffle(Object.values(shortForms).map(x=>x+' got').filter(x=>x!==answer)).slice(0,3);
const options=shuffle([answer,...alternatives]);
solved=false;
app.innerHTML=renderHeader('Bubble pop','Read the sentence. Pop its short form!',index+1,bubbleQuestions.length)+
'<div class="star-counter">Stars: <span id="bubbleStars">'+bubbleStars+'</span> / '+bubbleQuestions.length+'</div>'+
'<div class="star-strip" id="starStrip" aria-label="Earned stars">'+('⭐'.repeat(bubbleStars))+'</div>'+
'<div class="bubble-sentence" id="bubbleSentence"><span class="target-form">'+q[0]+' '+q[1]+' got</span> '+q[2]+'.</div>'+
'<div class="bubble-field">'+options.map((word,i)=>'<button class="bubble" data-bubble="'+i+'" style="left:'+([6,55,12,62][i])+'%;top:'+([44,46,205,210][i])+'px" aria-label="Pop '+word+'">'+word+'</button>').join('')+'</div>'+
'<div id="feedback" class="feedback" role="status" aria-live="polite"></div>'+
'<div class="actions"><button class="primary" id="bubbleNext" hidden>Next →</button></div>';
startBubbleMotion();
document.querySelectorAll('[data-bubble]').forEach(button=>button.onclick=()=>{
if(solved)return;
if(options[+button.dataset.bubble]!==answer){
button.classList.add('missed');button.disabled=true;
feedback('Try another bubble. Look at '+q[0]+'.');return;
}
solved=true;cancelAnimationFrame(bubbleFrame);bubbleStars++;
button.classList.add('popped');
document.querySelectorAll('[data-bubble]').forEach(b=>b.disabled=true);
document.querySelector('#bubbleStars').textContent=bubbleStars;
document.querySelector('#starStrip').textContent='⭐'.repeat(bubbleStars);
document.querySelector('#bubbleSentence').innerHTML='<span class="target-form">'+answer+'</span> '+q[2]+'.';
feedback('Pop! +1 star. Say the short sentence!',true);
document.querySelector('#bubbleNext').hidden=false;
});
document.querySelector('#bubbleNext').onclick=()=>{
if(index+1===bubbleQuestions.length){
app.innerHTML='<div class="finish"><div style="font-size:64px">⭐</div><h2>Super bubble popper!</h2><p>You earned '+bubbleStars+' / '+bubbleQuestions.length+' stars!</p><div class="star-strip">'+('⭐'.repeat(bubbleStars))+'</div><button class="primary" id="bubbleAgain">Play again ↻</button></div>';
document.querySelector('#bubbleAgain').onclick=()=>start(3);return;
}
index++;renderBubbles();
};
}
function finish(title,next){app.innerHTML='<div class="finish"><div style="font-size:65px">⭐</div><h2>'+title+'</h2><p>'+(next===null?'Choose a monster. Say three sentences about it.':'Ready for the next activity?')+'</p><div class="actions"><button id="repeat">Play again ↻</button>'+(next!==null?'<button class="primary" id="continue">Next activity →</button>':'')+'</div></div>';document.querySelector('#repeat').onclick=()=>start(stage);if(next!==null)document.querySelector('#continue').onclick=()=>start(next)}
document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>start(+b.dataset.stage));
document.querySelector('#restart').onclick=()=>start(stage);
start(0);
</script></body></html>
