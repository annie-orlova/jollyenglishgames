      const osc=audioContext.createOscillator(), gain=audioContext.createGain();
      osc.frequency.value=frequency; gain.gain.setValueAtTime(volume,start);
      gain.gain.exponentialRampToValueAtTime(.001,start+duration);
      osc.connect(gain);gain.connect(audioContext.destination);osc.start(start);osc.stop(start+duration);
    });
  }catch{}
}
function renderClock(seconds){
  $('clock').textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
}
function tick(){
  const seconds=Math.max(0,Math.ceil((deadline-performance.now())/1000));
  renderClock(seconds);
  if(!seconds){finish('Time is up');return false}
  return true;
}
function paintTile(el,color){
  el.classList.add('tile');
  el.style.setProperty('--light',palette[color][0]);
  el.style.setProperty('--dark',palette[color][1]);
}
function drawBoard(highlight=[]){
  cells.forEach((el,i)=>{
    el.className='cell';
    if(grid[i]!==null)paintTile(el,grid[i]);
    if(cleared.has(i))el.classList.add('cleared');
    if(highlight.includes(i))el.classList.add('hover');
  });
}
function pieceSquares(container,shape,size,offsetX,offsetY,color){
  shape.forEach(([x,y])=>{
    const el=document.createElement('span');
    el.className='square';
    el.style.cssText=`left:${offsetX+x*size}px;top:${offsetY+y*size}px;width:${size-1}px;height:${size-1}px`;
    el.dataset.x=x;el.dataset.y=y;
    paintTile(el,color);container.append(el);
  });
}
function renderTray(){
  pieces.replaceChildren();
  queue.forEach((shape,i)=>{
    const button=document.createElement('button');
    const active=phase==='blocks'&&i===turn;
    button.className='piece'+(active?' live':'');button.disabled=!active;
    button.setAttribute('aria-label',`Shape ${i+1}${active?', current shape':''}`);
    pieces.append(button);
    if(i<turn){button.style.visibility='hidden';return}
    const w=Math.max(...shape.map(([x])=>x))+1,h=Math.max(...shape.map(([,y])=>y))+1;
    const size=Math.min(17,Math.floor((button.clientWidth-4)/w));
    pieceSquares(button,shape,size,(button.clientWidth-w*size)/2,(button.clientHeight-h*size)/2,i);
    if(active){
      button.addEventListener('pointerdown',beginDrag);
      button.addEventListener('click',e=>{
        if(e.detail!==0||phase!=='blocks')return;
        keyboard=true;cells[boardFocus].focus();drawBoard(position(boardFocus%8,Math.floor(boardFocus/8))||[]);
      });
    }
  });
}
function position(x,y){
  const result=[];
  for(const [dx,dy] of queue[turn]||[]){
    const nx=x+dx,ny=y+dy,i=ny*8+nx;
    if(nx<0||nx>=8||ny<0||ny>=8||grid[i]!==null)return null;
    result.push(i);
  }
  return result.length?result:null;
}
function beginDrag(e){
  if(phase!=='blocks'||drag||!e.isPrimary||e.button!==0||!e.target.classList.contains('square'))return;
  e.preventDefault();
  keyboard=false;
  const rect=cells[0].getBoundingClientRect();
  const step=cells[1].getBoundingClientRect().left-rect.left;
  const square=e.target.getBoundingClientRect();
  const ghost=document.createElement('div');ghost.className='ghost';document.body.append(ghost);
  pieceSquares(ghost,queue[turn],step,0,0,turn);
  drag={id:e.pointerId,ghost,step,dx:(Number(e.target.dataset.x)+(e.clientX-square.left)/square.width)*step,dy:(Number(e.target.dataset.y)+(e.clientY-square.top)/square.height)*step};
  moveDrag(e);
}
function moveDrag(e){
  if(!drag||drag.id!==e.pointerId)return;
  const rect=cells[0].getBoundingClientRect(),left=e.clientX-drag.dx,top=e.clientY-drag.dy;
  Object.assign(drag.ghost.style,{left:left+'px',top:top+'px'});
  drag.target=position(Math.round((left-rect.left)/drag.step),Math.round((top-rect.top)/drag.step));
  const field=board.getBoundingClientRect();
  if(e.clientX<field.left||e.clientX>field.right||e.clientY<field.top||e.clientY>field.bottom)drag.target=null;
  drawBoard(drag.target||[]);
}
function cancelDrag(){drag?.ghost.remove();drag=null;drawBoard()}
window.addEventListener('pointermove',moveDrag);
window.addEventListener('pointerup',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  moveDrag(e);const target=drag.target;cancelDrag();
  if(target)place(target);
});
window.addEventListener('pointercancel',e=>{if(drag?.id===e.pointerId)cancelDrag()});
window.addEventListener('blur',cancelDrag);
board.addEventListener('keydown',e=>{
  const i=cells.indexOf(e.target);
  if(i<0)return;
  const moves={ArrowLeft:-1,ArrowRight:1,ArrowUp:-8,ArrowDown:8};
  if(e.key in moves){
    e.preventDefault();
    const next=i+moves[e.key];
    if(next>=0&&next<64){cells[i].tabIndex=-1;cells[next].tabIndex=0;boardFocus=next;cells[next].focus()}
  }
});
board.addEventListener('focusin',e=>{
  const i=cells.indexOf(e.target);
  if(i>=0&&keyboard)drawBoard(position(i%8,Math.floor(i/8))||[]);
});
board.addEventListener('click',e=>{
  const i=cells.indexOf(e.target);
  if(i<0||!keyboard||phase!=='blocks')return;
  const target=position(i%8,Math.floor(i/8));
  if(target)place(target);
});
function add(points){score=Math.max(0,score+points);$('score').textContent=score}
function reachedGoal(){if(goal&&score>=goal){finish('Score goal reached');return true}return false}
function checkStuck(){
  if(cells.some((_,i)=>position(i%8,Math.floor(i/8))))return;
  if(level==='Advanced'||level==='Expert'){finish('No space for the next shape');return}
  grid.fill(null);add(-100);drawBoard();$('feedback').textContent='Board cleared. You lost 100 points.';
}
function place(target){
  if(phase!=='blocks'||!tick())return;
  const wasKeyboard=keyboard;keyboard=false;
  target.forEach(i=>grid[i]=turn);
  tone([[110,0,.11,.10],[410,0,.075,.035]]);
  const lines=[];
  for(let n=0;n<8;n++){
    const row=Array.from({length:8},(_,i)=>n*8+i), col=Array.from({length:8},(_,i)=>i*8+n);
    if(row.every(i=>grid[i]!==null))lines.push(row);
    if(col.every(i=>grid[i]!==null))lines.push(col);
  }
  cleared=new Set(lines.flat());
  cleared.forEach(i=>grid[i]=null);
  if(lines.length){
    tone([[440,0,.18,.05],[554,.06,.18,.05],[659,.12,.24,.05]]);
    const animationRound=round;
    setTimeout(()=>{if(round===animationRound)cleared.clear()},340);
  }
  drawBoard();add(target.length*10+lines.length*100);turn++;
  if(reachedGoal())return;
  if(turn===3){ask();return}
  $('message').textContent=`Place shape ${turn+1} of 3.`;
  renderTray();checkStuck();
  if(wasKeyboard)pieces.querySelector('.live')?.focus();
}
function shuffle(items){
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  return items;
}
function newQueue(focus=false){
  phase='blocks';turn=0;
  const pool=pools[level];queue=Array.from({length:3},()=>pool[Math.floor(Math.random()*pool.length)]);
  $('heading').textContent='Place the shapes';$('message').textContent='Place shape 1 of 3.';
  $('challenge').hidden=true;$('feedback').textContent='';
  renderTray();checkStuck();
  if(focus)pieces.querySelector('.live')?.focus();
}
function setEntry(enabled){
  input.disabled=!enabled;$('check').disabled=!enabled;$('skip').disabled=!enabled;
  if(enabled)input.focus();
}
function mask(word,mode){
  let letter=0;
  return [...word].map(char=>char===' '? '  ': ((mode===1?letter++===0:letter++%2===0)?char:'_')).join(' ');
}
function ask(){
  phase='spell';renderTray();question++;attempts=0;shown=false;
  const due=repeats.findIndex(item=>item.at<=question);
  if(due>=0)current=repeats.splice(due,1)[0].word;
  else{
    if(!deck.length)deck=shuffle(words.slice());
    current=deck.pop();
  }
  $('heading').textContent='Spell the word';$('message').textContent='Look at the picture. Type the word and press Enter.';
  $('challenge').hidden=false;$('picture').src=pictures[words.indexOf(current)];
  input.value='';$('feedback').textContent='';$('hint').textContent='';
  if(support===1||support===2)$('hint').textContent=mask(current,support);
  if(support===3)showWord(false);else setEntry(true);
}
function recordMistake(){
  mistakes.add(current);
  if(!repeats.some(item=>item.word===current))repeats.push({word:current,at:question+3});
}
function showWord(correction){
  if(correction){recordMistake();shown=true}
  phase='show';setEntry(false);input.value='';
  $('hint').textContent=current;
  $('feedback').textContent='Look at the spelling.';
  delay=setTimeout(()=>{
    if(!tick())return;
    phase='spell';$('hint').textContent='';$('feedback').textContent='Now type it from memory.';setEntry(true);
  },3000);
}
$('skip').onclick=()=>{if(phase==='spell'&&tick())showWord(true)};
$('challenge').onsubmit=e=>{
  e.preventDefault();
  if(phase!=='spell'||!tick())return;
  const answer=input.value.trim().toLowerCase();
  if(!answer)return;
  if(answer!==current){
    attempts++;recordMistake();
    if(attempts>=2||shown)showWord(true);
    else{$('feedback').textContent='Try again.';input.select()}
    return;
  }
  if(!attempts&&!shown)firstTry++;
  if(!shown)independent++;
  add(shown?10:50);
  tone([[523,0,.15,.045],[784,.08,.23,.05]]);
  phase='correct';setEntry(false);$('feedback').textContent='Correct!';
  if(!reachedGoal())delay=setTimeout(()=>{if(tick())newQueue(true)},650);
};
function finish(reason){
  if(phase==='idle'||phase==='finished')return;
  phase='finished';clearInterval(timer);clearTimeout(delay);cancelDrag();renderTray();
  $('start').textContent='Play again';settings.forEach(el=>el.disabled=false);
  $('heading').textContent=reason;$('message').textContent=`${level} · ${$('support').options[support].text}`;
  $('challenge').hidden=true;$('feedback').textContent='';
  const summary=$('summary');summary.hidden=false;summary.replaceChildren();
  for(const line of [`Final score: ${score}`,`Correct on the first try: ${firstTry}`,`Correct before a correction: ${independent}`,`Words to review: ${[...mistakes].join(', ')||'None'}`]){
    const p=document.createElement('p');p.textContent=line;summary.append(p);
  }
}
$('sound').onclick=()=>{
  sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',sound);
  if(sound)tone([[523,0,.12,.04]]);
};
$('minutes').onchange=()=>{if(phase==='idle')renderClock(Number($('minutes').value)*60)};
$('start').onclick=()=>{
  if(phase!=='idle'&&phase!=='finished'){finish('Round finished');return}
  round++;grid.fill(null);cleared.clear();score=0;add(0);drawBoard();keyboard=false;
  level=$('difficulty').value;support=$('support').selectedIndex;goal=Number($('goal').value);
  deck=shuffle(words.slice());question=0;firstTry=0;independent=0;mistakes=new Set();repeats=[];
  deadline=performance.now()+Number($('minutes').value)*60000;
  settings.forEach(el=>el.disabled=true);$('summary').hidden=true;$('start').textContent='Finish';
  tone([[392,0,.1,.025]]);newQueue(true);tick();timer=setInterval(tick,100);
};
window.addEventListener('resize',()=>{if(drag)cancelDrag();if(queue.length)renderTray()});
</script></html>
