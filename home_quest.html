.wrap{max-width:990px;margin:auto;padding:26px 20px 44px}
header{display:flex;align-items:end;justify-content:space-between;color:#fff7e8;margin-bottom:20px;gap:8px}
h1{font:clamp(42px,8vw,72px)/.95 Georgia;margin:0;letter-spacing:-.04em} header p{margin:9px 0 0} 
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
button{font:inherit;font-weight:650;color:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;transition:background .15s}
button:hover:not(:disabled){background:#f6ebd1} button:focus-visible{outline:3px solid #bf6a35;outline-offset:2px}
nav button{background:#e7eddf;border:0} nav button[aria-current=true],.primary{background:var(--gold);color:#284137} 
main{background:var(--paper);border-radius:20px;padding:clamp(14px,3vw,28px);box-shadow:0 18px 70px #132f2d70}
.top{display:flex;justify-content:space-between;align-items:start;gap:10px}.top h2{font:32px Georgia;margin:0}.top p{margin:5px 0 12px}.count{font-weight:750;white-space:nowrap;background:#e1ebdd;padding:8px 12px;border-radius:999px}
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,1fr);gap:14px;max-width:730px;margin:auto}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-content:start}
.photos button{padding:3px;position:relative;overflow:hidden}.photos span{position:absolute;bottom:4px;right:4px;background:#285c49;color:white;padding:2px 7px;border-radius:8px}.photos span:empty{display:none}
.words{display:grid;gap:6px}.words button{padding:5px;min-height:35px}
img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:7px;background:#f6efe1}
.hero{width:min(100%,215px);margin:0 auto 12px;border:1px solid var(--line)}
.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:500px;margin:auto}
.selected{outline:3px solid #bc792a;outline-offset:-3px;background:#ffedb6}
.good,button.good:hover{background:#d5e9cf;border-color:#82a881}.bad,button.bad:hover{background:#f7d6cc;border-color:#c5715e}
.letters,.slots,.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}.letters button,.slots button{width:clamp(23px,5.3vw,40px);height:40px;padding:0}.letters button:disabled{visibility:hidden}.slots button{border-bottom:3px solid #739382}.gap{margin-left:9px}
.feedback{min-height:27px;text-align:center;margin:12px 0 2px;font-weight:700}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.foot button:first-child{font-size:14px}
.grid button{border-radius:4px;aspect-ratio:1;padding:0;font:750 clamp(10px,2vw,16px) ui-monospace,monospace}
.done{text-align:center;padding:30px 4px;font-size:22px}
@media(max-width:650px){.wrap{padding:16px 10px}nav button{font-size:12px;padding:9px 3px}.match{grid-template-columns:minmax(0,2fr) minmax(84px,1fr);gap:8px}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}.words button{font-size:13px}.top h2{font-size:25px}}
#search-frame{display:block;width:100%;height:820px;border:0}
#search-pane[hidden],#game[hidden]{display:none}
#sound{background:#e7eddf;color:var(--ink);white-space:nowrap;font-size:13px}
</style></head>

header class=\"gamebar\">\u003cstrong id=\"timer\" aria-label=\"Time remaining\">7:00\u003c/strong>\u003cdiv class=\"bar-instruction\">Find a word, then choose its match\u003c/div>\u003cdiv class=\"stats\">\u003cspan id=\"hearts\" role=\"img\" aria-label=\"5 lives remaining\">\u003c/span>\u003cstrong id=\"score\" aria-label=\"Score\">\u2713 0\u003c/strong>\u003c/div>\u003c/header>\u003cdiv class=\"titlebar\">\u003cdiv>\u003ch1>Word search \u00b7 Master\u003c/h1>\u003cp>Hold the first letter and drag to the last. Then choose its match.\u003c/p>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"reset\" id=\"visual-toggle\" aria-expanded=\"false\" aria-controls=\"visual-settings\">Appearance\u003c/button>\u003cbutton class=\"reset\" id=\"reset\">New game\u003c/button>\u003c/div>\u003c/div>\u003csection id=\"visual-settings\" class=\"panel settings\" hidden>\u003ch2>Appearance\u003c/h2>\u003cdiv class=\"setting-fields\">\u003clabel>Word highlights\u003cselect id=\"marker\">\u003coption value=\"circles\">Circles\u003c/option>\u003coption value=\"strips\">Colour strips\u003c/option>\u003coption value=\"underline\">Underlines\u003c/option>\u003c/select>\u003c/label>\u003clabel>Word directions\u003cselect id=\"directions\">\u003coption value=\"all\">Include diagonals\u003c/option>\u003coption value=\"straight\">Horizontal &amp; vertical only\u003c/option>\u003c/select>\u003c/label>\u003clabel>Word selection\u003cselect id=\"selection\">\u003coption value=\"exact\">Exact \u00b7 whole word\u003c/option>\u003coption value=\"partial\">Partial \u00b7 3+ letters\u003c/option>\u003c/select>\u003c/label>\u003clabel>Drag highlight\u003cinput type=\"color\" id=\"highlight\" value=\"#ffe2a0\">\u003c/label>\u003clabel>Letter size\u003cselect id=\"letter-size\">\u003coption value=\"18\">Small\u003c/option>\u003coption value=\"22\" selected>Medium\u003c/option>\u003coption value=\"26\">Large\u003c/option>\u003c/select>\u003c/label>\u003clabel>Font\u003cselect id=\"letter-font\">\u003coption value=\"system-ui\">Simple\u003c/option>\u003coption value=\"Georgia\">Serif\u003c/option>\u003coption value=\"monospace\">Monospace\u003c/option>\u003coption value=\"Trebuchet MS\">Trebuchet\u003c/option>\u003coption value=\"Verdana\">Verdana\u003c/option>\u003coption value=\"Times New Roman\">Times\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"settings-note\">Changing word directions starts a new round. Settings are saved in this browser.\u003c/p>\u003c/section>\u003cdiv class=\"layout\">\u003csection class=\"panel\">\u003ch2>1 \u00b7 Find a word\u003c/h2>\u003cdiv id=\"grid\" aria-label=\"Word search grid\">\u003c/div>\u003cdiv id=\"message\" role=\"status\" aria-live=\"polite\">Hold the first letter and drag to the last.\u003c/div>\u003cfooter>\u003cspan id=\"direction-hint\">\u2192 Across &nbsp; \u2193 Down &nbsp; \u2198 \u2199 Diagonally down\u003c/span>\u003cbr>Note: spaces are not shown on the grid\u003c/footer>\u003c/section>\u003csection class=\"panel\">\u003ch2>2 \u00b7 Choose the match \u003cspan id=\"progress\">0 / 0\u003c/span>\u003c/h2>\u003cdiv id=\"definitions\">\u003c/div>\u003c/section>\u003c/div>\u003cfooter class=\"rules\">7 minutes \u00b7 5 lives \u00b7 1 point per correct pair. A wrong word or definition costs one life.\u003c/footer>\u003c/main>\u003cscript>\n/* WORD SEARCH MASTER v1.6\n   Create a separate populated copy; keep this master empty.\n   When preparing a new Word Search, check the supplied vocabulary first.\n   If a word has no supplied definition, prepare an illustration for that word\n   before building the game. Use the illustration as the matching card and leave\n   the definition blank. Embed the prepared illustrations, then build the Word Search.\n   Content lives only in GAME.items. Each item needs a unique word plus:\n   text (definition), or image (embedded data URL) and alt (image description).\n   Both text and image may be supplied. Do not put the answer in unsolved card labels.\n   Spaces, hyphens and apostrophes in words are ignored on the grid.\n   Embed all images in the HTML for a single offline file.\n   A supplied reference photo guides design; do not automatically use it as the background.\n   Visual design can be changed in CSS or GAME.design without changing the engine.\n   Rules: drag a straight line; select a matching card; +1 per pair;\n   5 starting lives, -1 for a wrong multi-letter selection or wrong card;\n   no penalty for a single click, cancelled drag or previously solved word;\n   7-minute countdown starts on the first selection, stops at win/loss/timeout.\n*/\nconst GAME = {\n  title: 'Home Quest \u00b7 Word Search',\n  timeLimitSeconds: 420,\n  startingLives: 5,\n  minimumGridSize: 13,\n  design: {\n    theme: 'sage',\n    marker: 'circles',\n    selection: 'exact',\n    directions: 'all',\n    highlight: '#ffe2a0',\n    size: '22',\n    font: 'system-ui',\n    backgroundImage: ''\n  },\n  items: HOME_ITEMS\n};\nconst vocabulary=GAME.items.map(item=>[item.word,item.text||'']);\nconst normalizedWord=word=>word.replace(/[\\s\u2019'\\-]/g,'').toUpperCase();\nconst N=Math.max(GAME.minimumGridSize,...vocabulary.map(v=>normalizedWord(v[0]).length));let board,words,first,pending,solved,order;let dragging=false,trail=[];const LIMIT=GAME.timeLimitSeconds;let deadline=null,ticker=null,remaining=LIMIT,ended=false;let lives=GAME.startingLives;\nconst grid=document.querySelector('#grid'),definitions=document.querySelector('#definitions'),message=document.querySelector('#message');\nconst wordPalette = [\n  '#f8c1cc', '#b8e2fc', '#f9dda0', '#ccbef6', '#a9e4c7',\n  '#ffc5a8', '#b3d4fe', '#dbe99b', '#eac0f0', '#a8e1e1',\n  '#f3c0a5', '#c4cffa', '#ecd0a4', '#f3afd1', '#bcdcb1',\n];\nconst wordInk = [\n  '#aa2851', '#15619a', '#805309', '#6344a6', '#21694c',\n  '#a34523', '#3158a5', '#546b18', '#853593', '#126868',\n  '#953d29', '#4a51a1', '#765221', '#a1296c', '#396738',\n];\nconst wordColor = id => wordPalette[id % wordPalette.length];\nconst wordAccent = id => wordInk[id % wordInk.length];\n\nfunction paintWordCell(cell, ids) {\n  if (!ids.length) return;\n  const darkInk = appearance.marker === 'strips' ||\n    (appearance.marker === 'underline' && appearance.theme !== 'chalkboard');\n  const color = darkInk ? wordAccent : wordColor;\n  cell.style.setProperty('--word-letter', color(ids[0]));\n  if (ids.length === 1) {\n    cell.style.setProperty('--word-fill', color(ids[0]));\n    return;\n  }\n  const bands = ids.map((id, index) =>\n    color(id) + ' ' + (index / ids.length * 100) + '% ' +\n    ((index + 1) / ids.length * 100) + '%'\n  );\n  cell.style.setProperty('--word-fill', 'linear-gradient(135deg,' + bands.join(',') + ')');\n}\n\nfunction playFeedback(kind) { parent.playHomeSound(kind); }\nnew ResizeObserver(() => {\n  parent.sizeHomeSearch(document.querySelector('main').getBoundingClientRect().height);\n}).observe(document.querySelector('main'));\n\nfunction shuffle(a){return a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(a=>a[1])}\nfunction generate(){\n  const horizontal=[0,1], vertical=[1,0];\n  const directions=appearance.directions==='straight'\n    ? [horizontal,vertical]\n    : [[1,1],horizontal,vertical,[1,-1]];\n  const placementOrder=vocabulary.map((_,i)=>i).sort((a,b)=>vocabulary[b][0].length-vocabulary[a][0].length);\n  for(let attempt=0;attempt\u003c200;attempt++){board=Array(N*N).fill('');words=[];let ok=true;for(const [position,id] of placementOrder.entries()){const text=normalizedWord(vocabulary[id][0]);let placed=false;for(let trial=0;trial\u003c500;trial++){const [dr,dc]=directions[position === 0 ? 0 : (position + attempt) % directions.length],r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);let cells=[];for(let k=0;k\u003ctext.length;k++){let rr=r+k*dr,cc=c+k*dc;if(rr\u003c0||rr>=N||cc\u003c0||cc>=N){cells=[];break}cells.push(rr*N+cc)}if(cells.length===text.length&&cells.every((x,k)=>!board[x]||board[x]===text[k])){cells.forEach((x,k)=>board[x]=text[k]);words[id]={id,text,cells};placed=true;break}}if(!placed){ok=false;break}}if(ok){board=board.map(x=>x||'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]);return}}throw Error('Unable to create grid')}\nfunction draw(){grid.replaceChildren(...board.map((letter,i)=>{let b=document.createElement('button');b.className='cell';const glyph=document.createElement('span');glyph.textContent=letter;b.append(glyph);b.setAttribute('aria-label',`${letter}, row ${Math.floor(i/N)+1}, column ${i%N+1}`);const completedIds=words.filter(w=>solved.has(w.id)&&w.cells.includes(i)).map(w=>w.id);\n    if(completedIds.length)b.classList.add('done');\n    if(pending!==null&&words[pending].cells.includes(i)){\n      b.classList.add('selected');\n      paintWordCell(b,[pending]);\n    }else{\n      paintWordCell(b,completedIds);\n    }if(first===i)b.classList.add('start');b.disabled=ended;b.dataset.index=i;b.onclick=e=>{if(e.detail===0)choose(i)};return b}));definitions.replaceChildren(...order.map(id=>{let b=document.createElement('button');b.className='definition'+(solved.has(id)?' done':'');b.dataset.matchId=id;\n    if(solved.has(id)){\n      b.style.setProperty('--word-fill',wordColor(id));\n      b.style.setProperty('--word-card',wordColor(id));\n      b.style.setProperty('--word-ink',wordAccent(id));\n      const check=document.createElement('span');\n      check.className='match-check';\n      check.textContent='\u2713';\n      check.setAttribute('aria-hidden','true');\n      b.append(check);\n    }\n    const item=GAME.items[id];if(item.image){const img=document.createElement('img');img.src=item.image;img.alt=item.alt||'Picture '+(id+1);img.draggable=false;b.append(img)}if(item.text){const label=document.createElement('span');label.textContent=(solved.has(id)?item.word+' \u2014 ':'')+item.text;b.append(label)}else if(solved.has(id)){const label=document.createElement('span');label.textContent=item.word;b.append(label)}if(!item.text)b.setAttribute('aria-label',solved.has(id)?'Found: '+item.word:'Picture '+(id+1));b.disabled=ended||solved.has(id);b.onclick=()=>match(id);return b}));document.querySelector('#score').textContent='\u2713 '+solved.size;drawHearts();document.querySelector('#progress').textContent=solved.size+' / '+vocabulary.length}\nfunction choose(i){if(ended)return;startTimer();if(!checkTime())return;if(first===null){pending=null;first=i;message.textContent=appearance.selection==='partial'?'Choose the end of your selection.':'Now choose the last letter.';draw();return}if(first===i){first=null;draw();return}const cells=lineBetween(first,i);first=null;selectWord(cells);}\nfunction containsSelection(path, selection) {\n  const start = path.indexOf(selection[0]);\n  if (start \u003c 0) return false;\n  return [1, -1].some(direction =>\n    selection.every((cell, offset) => path[start + direction * offset] === cell)\n  );\n}\n\nfunction selectWord(cells) {\n  const exact = words.find(word =>\n    word.cells.length === cells.length && containsSelection(word.cells, cells)\n  );\n  const partial = appearance.selection === 'partial' && !exact && cells.length >= 3\n    ? words.filter(word => containsSelection(word.cells, cells))\n    : [];\n  const available = partial.filter(word => !solved.has(word.id));\n  const found = exact || available[0] || partial[0];\n  pending = null;\n\n  if (available.length > 1) {\n    message.textContent = 'More than one word fits. Select a few more letters.';\n    draw();\n    return;\n  }\n  if (found && solved.has(found.id)) {\n    message.textContent = 'You have already found this word.';\n    draw();\n    return;\n  }\n  if (found) {\n    pending = found.id;\n    message.textContent = '\u201c' + vocabulary[pending][0] + '\u201d \u2014 choose its match.';\n    draw();\n    playFeedback('word');\n    found.cells.forEach(index => grid.children[index].classList.add('word-pop'));\n    return;\n  }\n  if (cells.length > 1 && (appearance.selection === 'exact' || cells.length >= 3)) {\n    loseLife('That is not a hidden word. Try again.');\n    return;\n  }\n  message.textContent = selectionHint();\n  draw();\n}\nfunction lineBetween(a,b){const ar=Math.floor(a/N),ac=a%N,br=Math.floor(b/N),bc=b%N,rr=br-ar,cc=bc-ac;if(rr!==0&&cc!==0&&(appearance.directions==='straight'||Math.abs(rr)!==Math.abs(cc)))return [a];const steps=Math.max(Math.abs(rr),Math.abs(cc));return Array.from({length:steps+1},(_,k)=>(ar+k*Math.sign(rr))*N+ac+k*Math.sign(cc))}\nfunction paintTrail(){grid.querySelectorAll('.cell').forEach((b,i)=>{b.classList.toggle('trail',trail.includes(i));b.classList.toggle('start',i===first)})}\nfunction cellAt(e){const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('#grid .cell');return b?Number(b.dataset.index):null}\ngrid.addEventListener('pointerdown',e=>{if(e.button!==0||ended||solved.size===vocabulary.length)return;const i=cellAt(e);if(i===null)return;startTimer();if(!checkTime())return;e.preventDefault();pending=null;first=i;trail=[i];dragging=true;draw();paintTrail();grid.setPointerCapture(e.pointerId);message.textContent=selectionHint()});\ngrid.addEventListener('pointermove',e=>{if(!dragging)return;const i=cellAt(e);if(i===null)return;trail=lineBetween(first,i);paintTrail()});\nfunction finishDrag(e){if(!dragging||!checkTime())return;const i=cellAt(e);if(i!==null)trail=lineBetween(first,i);const cells=[...trail];dragging=false;first=null;trail=[];if(grid.hasPointerCapture(e.pointerId))grid.releasePointerCapture(e.pointerId);if(i===null){pending=null;message.textContent='Selection cancelled. Try again.';draw();return}selectWord(cells)}\ngrid.addEventListener('pointerup',finishDrag);\ngrid.addEventListener('pointercancel',()=>{dragging=false;first=null;trail=[];pending=null;draw();message.textContent=selectionHint()});\nfunction match(id) {\n  if (ended || !checkTime()) return;\n  if (pending === null) {\n    message.textContent = 'Find and select a word on the grid first.';\n    return;\n  }\n  if (id !== pending) {\n    loseLife('Not quite. Choose another match.');\n    return;\n  }\n  solved.add(id);\n  pending = null;\n  if (solved.size === vocabulary.length) {\n    endGame('Complete! ' + solved.size + ' points \u00b7 ' + formatTime(LIMIT-remaining) + ' used.');\n  } else {\n    message.textContent = 'Correct! +1 point. Find the next word.';\n    draw();\n  }\n  playFeedback('match');\n  definitions.querySelector('[data-match-id=\"' + id + '\"]')?.classList.add('match-pop');\n}\nfunction drawHearts(){document.querySelector('#hearts').replaceChildren(...Array.from({length:GAME.startingLives},(_,i)=>{const h=document.createElement('span');h.className='heart'+(i>=lives?' lost':'');h.textContent='\u2665';h.setAttribute('aria-hidden','true');return h}));document.querySelector('#hearts').setAttribute('aria-label',lives+' lives remaining')}\nfunction loseLife(text){if(ended)return;playFeedback('retry');lives=Math.max(0,lives-1);if(lives===0){endGame('No lives left. '+solved.size+' / '+vocabulary.length+' pairs \u00b7 '+solved.size+' points. Click New game to try again.');return}message.textContent=text+' \u22121 life.';draw()}\nfunction endGame(text){ended=true;clearInterval(ticker);dragging=false;first=null;trail=[];pending=null;draw();message.textContent=text}\nfunction formatTime(seconds){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}\nfunction updateTimer(){const t=document.querySelector('#timer');t.textContent=formatTime(remaining);t.style.color=remaining\u003c=60?'#bd3434':''}\nfunction startTimer(){if(deadline!==null||ended)return;deadline=Date.now()+LIMIT*1000;ticker=setInterval(checkTime,200)}\nfunction checkTime(){if(ended)return false;if(deadline===null)return true;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));updateTimer();if(remaining>0)return true;endGame(\"Time's up! \"+solved.size+' / '+vocabulary.length+' pairs \u00b7 '+solved.size+' points. Click New game to try again.');return false}\nfunction newGame(){lives=GAME.startingLives;clearInterval(ticker);ticker=null;deadline=null;remaining=LIMIT;ended=false;updateTimer();dragging=false;trail=[];first=null;pending=null;solved=new Set();if(!vocabulary.length){ended=true;board=[];words=[];order=[];draw();grid.classList.add('empty');message.textContent='Empty master \u2014 ready for your words and matching cards.';definitions.textContent='Definitions or pictures will appear here.';return}grid.classList.remove('empty');generate();order=shuffle(vocabulary.map((_,i)=>i));message.textContent=selectionHint();draw()}\ndocument.querySelector('#reset').onclick=newGame;\nconst appearanceDefaults={...GAME.design};let appearance={...appearanceDefaults};\ntry{const saved=JSON.parse(localStorage.getItem('wordsearch-appearance:'+GAME.title)||'null');if(saved){if(['all','straight'].includes(saved.directions))appearance.directions=saved.directions;if(['exact','partial'].includes(saved.selection))appearance.selection=saved.selection;if(['circles','strips','underline'].includes(saved.marker))appearance.marker=saved.marker;if(/^#[0-9a-f]{6}$/i.test(saved.highlight))appearance.highlight=saved.highlight;if(['18','22','26'].includes(saved.size))appearance.size=saved.size;if(['system-ui','Georgia','monospace','Trebuchet MS','Verdana','Times New Roman'].includes(saved.font))appearance.font=saved.font}}catch{}\nfunction selectionHint() {\n  return appearance.selection === 'partial'\n    ? 'Drag across a word or at least three of its letters.'\n    : 'Hold the first letter and drag to the last.';\n}\nfunction applyAppearance(){\n  document.querySelector('#direction-hint').textContent = appearance.directions==='straight'\n    ? '\u2192 Across \u00b7 \u2193 Down'\n    : '\u2192 Across \u00b7 \u2193 Down \u00b7 \u2198 \u2199 Diagonally down';\n  document.querySelector('.titlebar p').textContent=selectionHint()+' Then choose its match.';\nif(GAME.design.backgroundImage)document.body.style.backgroundImage='url('+JSON.stringify(GAME.design.backgroundImage)+')';document.body.dataset.theme=appearance.theme;document.body.dataset.marker=appearance.marker;document.documentElement.style.setProperty('--highlight',appearance.highlight);document.documentElement.style.setProperty('--letter-size',appearance.size+'px');document.documentElement.style.setProperty('--letter-font',({'Trebuchet MS':'\"Trebuchet MS\", sans-serif',Verdana:'Verdana, sans-serif','Times New Roman':'\"Times New Roman\", serif'}[appearance.font] || appearance.font))}\nfor(const [id,key] of [['marker','marker'],['selection','selection'],['directions','directions'],['highlight','highlight'],['letter-size','size'],['letter-font','font']]){const field=document.querySelector('#'+id);field.value=appearance[key];field.addEventListener('input',()=>{appearance[key]=field.value;\n  if(key==='theme'&&['chalkboard','beach'].includes(appearance.theme)){\n    appearance.marker=appearance.theme==='chalkboard'?'underline':'circles';\n    document.querySelector('#marker').value=appearance.marker;\n  }\n  applyAppearance();\n  if(key==='marker'||key==='theme')draw();\n  if(key==='directions')newGame();\n  if(key==='selection'&&!ended&&pending===null&&first===null)message.textContent=selectionHint();\n  try{localStorage.setItem('wordsearch-appearance:'+GAME.title,JSON.stringify(appearance))}catch{}})}\ndocument.querySelector('#visual-toggle').onclick=()=>{const panel=document.querySelector('#visual-settings');panel.hidden=!panel.hidden;document.querySelector('#visual-toggle').setAttribute('aria-expanded',String(!panel.hidden))};\ndocument.title=GAME.title+' \u00b7 Word search';document.querySelector('h1').textContent=GAME.title;\ngrid.style.gridTemplateColumns='repeat('+N+',1fr)';\ndocument.querySelector('.rules').textContent=formatTime(LIMIT)+' minutes \u00b7 '+GAME.startingLives+' lives \u00b7 1 point per correct pair. A wrong word or match costs one life.';\ntry{if(N>30)throw Error('Words are too long for this grid.');const seen=new Set();for(const item of GAME.items){const word=normalizedWord(item.word||'');if(!/^[A-Z]{2,30}$/.test(word))throw Error('Use English words of at least two letters.');if(seen.has(word))throw Error('Each hidden word must be unique.');seen.add(word);if(!item.text&&!item.image)throw Error('Each word needs a definition or picture.')}applyAppearance();newGame()}catch(error){ended=true;message.textContent='Content setup: '+error.message;document.querySelector('#reset').disabled=true}\n\n\u003c/script>\u003c/html>\n";
const searchPane = document.querySelector('#search-pane');
const searchFrame = document.querySelector('#search-frame');
function sizeHomeSearch(height){
  if(height > 0) searchFrame.style.height = Math.ceil(height)+'px';
}
function showSearch(){
  if(searchFrame.hasAttribute('srcdoc')) return;
  const items = searchWords.map((word,i) => ({word,image:images[entries.indexOf(word)],alt:'Picture '+(i+1)}));
  searchFrame.srcdoc = searchMaster.replace('HOME_ITEMS',JSON.stringify(items));
}

const soundButton = document.querySelector('#sound');
let soundOn = true;
try { soundOn = localStorage.getItem('home-quest-sound') !== 'off'; } catch {}
let audio;
const pitches = {tap:[440], word:[392,523], match:[523,659,784], retry:[330,277]};
function playHomeSound(kind){
  if(!soundOn) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if(!Audio) return;
  try {
    audio ??= new Audio();
    if(audio.state==='suspended') audio.resume().catch(()=>{});
    pitches[kind].forEach((frequency,i)=>{
      const at=audio.currentTime+i*0.07;
      const note=audio.createOscillator();
      const gain=audio.createGain();
      note.frequency.value=frequency;
      gain.gain.setValueAtTime(0.001,at);
      gain.gain.exponentialRampToValueAtTime(kind==='tap'?0.038:0.085,at+0.015);
      gain.gain.exponentialRampToValueAtTime(0.001,at+0.15);
      note.connect(gain);
      gain.connect(audio.destination);
      note.start(at);
      note.stop(at+0.16);
    });
  } catch {}
}
function updateSound(){
  soundButton.textContent=soundOn?'Sound on':'Sound off';
  soundButton.setAttribute('aria-pressed',String(soundOn));
}
soundButton.addEventListener('click',()=>{
  soundOn=!soundOn;
  try { localStorage.setItem('home-quest-sound',soundOn?'on':'off'); } catch {}
  updateSound();
  playHomeSound('tap');
});
updateSound();
function newState(page){
  const state={order:shuffle(indices),index:0,chosen:null,matched:new Set(),letters:[],note:''};
  prepare(state,page);
  return state;
}
function prepare(state,page){
  const id=state.order[state.index];
  state.note='';state.bad=null;state.correct=false;state.chosen=null;state.letters=[];
  if(id===undefined) return;
  if(page===0) state.options=shuffle(state.order.slice(state.index,state.index+6));
  if(page===1) state.options=shuffle([id,...shuffle(indices.filter(i=>i!==id)).slice(0,3)]);
  if(page===2){
    const answer=entries[id].replaceAll(' ','');
    do {state.bank=shuffle(answer);} while(state.bank.join('')===answer);
  }
}
const states=[];
let page=0;
const current=()=>states[page] ?? (states[page]=newState(page));
function render(){
  nav.innerHTML=titles.map((t,i)=>button(t,'tab:'+i,'','aria-current="'+(i===page)+'"')).join('');
  game.hidden=page===3;
  searchPane.hidden=page!==3;
  if(page===3){showSearch();return;}
  const s=current();
  const total=entries.length;
  const progress=page===0?s.matched.size:s.index+Number(s.correct);
  const done=s.index>=total;
  const id=s.order?.[s.index];
  let content='';
  if(done){
    content='<div class="done"><strong>Well done!</strong><p>'+total+' words complete.</p></div>';
  }else if(page===0){
    const batch=s.order.slice(s.index,s.index+6);
    content='<div class="match"><div class="photos">'+batch.map((i,k)=>button(art(i)+'<span>'+(s.matched.has(i)?entries[i]:k+1)+'</span>','image:'+i,s.matched.has(i)?'good':s.chosen===i?'selected':'','aria-label="Picture '+(k+1)+'" '+(s.matched.has(i)?'disabled':''))).join('')+'</div><div class="words">'+s.options.map(i=>button(entries[i],'match:'+i,s.matched.has(i)?'good':s.bad===i?'bad':'',s.matched.has(i)?'disabled':'')).join('')+'</div></div>';
  }else if(page===1){
    content=art(id,'hero')+'<div class="choice">'+s.options.map(i=>button(entries[i],'quiz:'+i,s.correct && i===id?'good':s.bad===i?'bad':'',s.correct?'disabled':'')).join('')+'</div>';
  }else if(page===2){
    const split=entries[id].indexOf(' ');
    content=art(id,'hero')+'<div class="slots">'+s.bank.map((_,i)=>button(s.bank[s.letters[i]]??'&nbsp;','slot:'+i,i===split?'gap':'','aria-label="Letter slot '+(i+1)+'" '+(s.letters[i]===undefined||s.correct?'disabled':''))).join('')+'</div><div class="letters">'+s.bank.map((c,i)=>button(c,'letter:'+i,'',s.letters.includes(i)||s.correct?'disabled':'')).join('')+'</div><div class="controls">'+button('Clear','clear','',s.correct?'disabled':'')+button('Check','check','primary',s.correct?'disabled':'')+'</div>';
  }
  const batchDone=page===0&&!done&&s.order.slice(s.index,s.index+6).every(i=>s.matched.has(i));
  const next=done&&page<3?button('Next activity →','tab:'+(page+1),'primary'):batchDone||s.correct&&!done?button(batchDone?'Next set →':'Next word →','next','primary'):'';
  game.innerHTML='<div class="top"><div><h2>'+titles[page]+'</h2><p>'+instructions[page]+'</p></div><div class="count">'+progress+' / '+total+'</div></div>'+content+'<div class="feedback" role="status">'+(s.note||'')+'</div><div class="foot">'+button('Start again','restart')+next+'</div>';
}
document.addEventListener('click',event=>{
  const target=event.target.closest('button[data-action]');
  if(!target) return;
  const [action,value]=target.dataset.action.split(':');
  const i=Number(value);
  if(action==='tab'){
    page=i;
    playHomeSound('tap');
    render();
    return;
  }
  if(page===3) return;
  const s=current(), id=s.order?.[s.index];
  switch(action){
    case 'restart': states[page]=newState(page);break;
    case 'image': s.chosen=i;s.bad=null;s.note='Now choose a word.';break;
    case 'match':
      if(s.chosen===null){s.note='Choose a picture first.';break;}
      if(s.chosen===i){s.matched.add(i);s.chosen=null;s.bad=null;s.note='Nice match!';}
      else{s.bad=i;s.note='Try another word.';}
      break;
    case 'quiz':
      s.correct=i===id;s.bad=s.correct?null:i;s.note=s.correct?'Correct!':'Try again.';break;
    case 'letter': s.letters.push(i);s.note='';break;
    case 'slot': s.letters.splice(i,1);s.note='';break;
    case 'clear': s.letters=[];s.note='';break;
    case 'check':{
      const guess=s.letters.map(j=>s.bank[j]).join('');
      s.correct=guess===entries[id].replaceAll(' ','');
      s.note=s.correct?'Correct!':guess.length<s.bank.length?'Use all the letters.':'Check the letter order and try again.';
      break;
    }
    case 'next': s.index+=page===0?6:1;prepare(s,page);break;
  }
  const graded=['match','quiz','check'].includes(action);
  const correct=action==='match'?s.matched.has(i):s.correct;
  playHomeSound(graded?(correct?'match':'retry'):'tap');
  render();
});
render();
</script></body></html>
