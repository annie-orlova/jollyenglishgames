<style>
:root {
  color-scheme: light;
  --ink: #15263a; --muted: #465b71; --navy: #142840; --blue: #184ea6;
  --line: #cbd8e5; --page: #f2f6fa; --white: #fff;
  --good: #146348; --good-bg: #edf8f2; --bad: #9c3022; --bad-bg: #fff1ed;
  font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink); background: var(--page);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--blue); }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; }
button, summary, select { cursor: pointer; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, select:focus-visible {
  outline: 3px solid #2774d8; outline-offset: 3px;
}
.wrap { width: min(100% - 2rem, 70rem); margin-inline: auto; }
.top { background: var(--navy); color: white; }
.top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 4rem; }
.brand { color: white; font-weight: 720; text-decoration: none; }
.profile { position: relative; max-width: 45%; }
.profile summary { padding: .42rem .7rem; border: 1px solid #8096ad; border-radius: .55rem; overflow-wrap: anywhere; }
.profile-pane {
  position: absolute; right: 0; top: calc(100% + .65rem); z-index: 5;
  width: min(19rem, 88vw); padding: 1rem; color: var(--ink); background: white;
  border: 1px solid var(--line); border-radius: .85rem; box-shadow: 0 10px 30px #14284022;
}
.profile-pane label { display: block; font-size: .875rem; font-weight: 650; margin-bottom: .3rem; }
.profile-pane input, .profile-pane select { display: block; width: 100%; margin-bottom: .6rem; }
.profile-pane form { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: .8rem; }
main { padding-block: 2.2rem 3rem; min-height: 70vh; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.08; letter-spacing: -.035em; }
h2 { font-size: 1.2rem; }
.eyebrow { color: var(--blue); font-size: .78rem; font-weight: 750; text-transform: uppercase; letter-spacing: .12em; margin-bottom: .65rem; }
.intro { margin-top: .7rem; max-width: 64ch; color: var(--muted); }
.small { color: var(--muted); font-size: .88rem; }
.notice { color: var(--bad); font-size: .88rem; margin-top: .5rem; }
.status-strip {
  display: flex; align-items: center; flex-wrap: wrap; gap: .6rem 1.2rem; margin-top: 1.3rem;
  background: white; border: 1px solid var(--line); padding: .85rem 1rem; border-radius: .8rem;
}
.status-strip strong { font-weight: 730; }
.grid { display: grid; gap: .9rem; margin-top: 1.35rem; }
.tiers { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sets { grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); }
.card { background: white; border: 1px solid var(--line); border-radius: .85rem; padding: 1rem; }
.tier-card { border-top: .28rem solid var(--accent); }
.card h2 a { color: var(--ink); text-underline-offset: .18em; }
.card p { margin-top: .35rem; }
.card .button { margin-top: .85rem; }
.quick { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .8rem; }
.quick a { display: inline-flex; border: 1px solid var(--line); padding: .3rem .5rem; border-radius: .4rem; text-decoration: none; }
.set-card { display: block; text-decoration: none; color: var(--ink); }
.set-card:hover { border-color: var(--blue); background: #fbfdff; }
.set-heading { display: flex; justify-content: space-between; align-items: baseline; gap: .45rem; flex-wrap: wrap; }
.pill { border-radius: 1rem; padding: .12rem .5rem; background: #edf2f8; color: #38536e; font-weight: 650; font-size: .77rem; }
.pill.done { background: var(--good-bg); color: var(--good); }
.pill.started { background: #fff4da; color: #74500e; }
.crumbs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; font-size: .9rem; }
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: .3rem;
  padding: .55rem .85rem; min-height: 2.6rem; border: 1px solid transparent; border-radius: .55rem;
  background: var(--blue); color: white; text-decoration: none; font-weight: 680;
}
.button:hover { background: #133d81; }
.button.secondary { background: white; color: var(--blue); border-color: var(--line); }
.button.secondary:hover { background: #edf4ff; }
input, select { color: var(--ink); background: white; border: 1px solid #91a5bb; border-radius: .42rem; padding: .35rem .55rem; }
.exercise { display: grid; gap: .6rem; margin: 1.1rem 0 0; padding: 0; list-style: none; }
.question {
  display: grid; grid-template-columns: 2.25rem minmax(0, 1fr) auto; gap: .65rem; align-items: start;
  background: white; border: 1px solid var(--line); border-radius: .65rem; padding: .75rem .8rem;
}
.question[data-status="correct"] { background: var(--good-bg); border-color: #92c3ad; }
.question[data-status="incorrect"], .question[data-status="blank"] { background: var(--bad-bg); border-color: #e0a79e; }
.item { color: var(--muted); font-size: .85rem; font-weight: 650; padding-top: .22rem; }
.sentence { overflow-wrap: anywhere; }
.answer { width: min(11.8rem, 100%); min-height: 2.1rem; margin-block: .1rem; vertical-align: baseline; }
.cue { background: #e8eff8; color: #1b3d67; font-size: .78rem; font-weight: 760; padding: .25rem .47rem; border-radius: .35rem; letter-spacing: .035em; }
.feedback { display: block; font-size: .83rem; font-weight: 650; margin-top: .28rem; }
.feedback:empty { display: none; }
.question[data-status="correct"] .feedback { color: var(--good); }
.question[data-status="incorrect"] .feedback, .question[data-status="blank"] .feedback { color: var(--bad); }
.checkbar {
  position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: .75rem;
  background: white; padding: .7rem .85rem; margin-top: 1rem; border: 1px solid var(--line);
  border-radius: .65rem .65rem 0 0; box-shadow: 0 -4px 16px #14284015;
}
.check-actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.result { font-weight: 650; min-width: 0; }
footer { border-top: 1px solid var(--line); color: var(--muted); padding: 1.1rem 0; font-size: .87rem; }
[hidden] { display: none !important; }
@media (max-width: 680px) {
  main { padding-top: 1.4rem; }
  .tiers { grid-template-columns: 1fr; }
  .question { grid-template-columns: 1.65rem minmax(0, 1fr); gap: .2rem .45rem; padding: .65rem; }
  .question .cue { grid-column: 2; grid-row: 1; justify-self: start; margin-bottom: .15rem; }
  .question .sentence { grid-column: 2; grid-row: 2; }
  .checkbar { flex-wrap: wrap; }
}
</style>

<script>
'use strict';
const exercises = JSON.parse(document.querySelector('#exercise-data').textContent);
const sets = Object.keys(exercises);
const tiers = {
  P: {title: 'Priority', description: 'Advanced forms and common spelling or meaning traps.', color: '#7652ad'},
  M: {title: 'Medium', description: 'Forms that may need a spelling or usage check.', color: '#a36924'},
  E: {title: 'Easy', description: 'Familiar forms and more predictable transformations.', color: '#247f66'}
};
const tierSets = prefix => sets.filter(set => set.startsWith(prefix));
const namespace = 'cae-word-formation-v1';
const memory = new Map();
let persistent = true;
const app = document.querySelector('#app');
const profileMenu = document.querySelector('#profile-menu');
const profileSelect = document.querySelector('#profile-select');
const profileName = document.querySelector('#profile-name');
const profileMessage = document.querySelector('#profile-message');

function read(key, fallback) {
  if (!persistent) return memory.get(key) ?? fallback;
  try {
    const value = JSON.parse(localStorage.getItem(key));
    if (value !== null) memory.set(key, value);
    return value ?? fallback;
  } catch {
    persistent = false;
    return memory.get(key) ?? fallback;
  }
}

function write(key, value) {
  memory.set(key, value);
  if (!persistent) return;
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch {
    persistent = false;
    updateStorageNotice();
  }
}

const guest = {id: 'guest', name: 'Guest'};
let profiles = read(namespace + ':profiles', [guest]);
let active = read(namespace + ':active', 'guest');
if (!profiles.some(profile => profile.id === active)) active = 'guest';

const keyFor = set => namespace + ':' + active + ':' + set;
const recordFor = set => read(keyFor(set), {});
const text = value => String(value).replace(/[&<>"']/g, char =>
  ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'})[char]);
const normalize = value => value.trim().toLowerCase();
const isComplete = (set, record = recordFor(set)) => record.best === exercises[set].length;
const count = (list, predicate) => list.filter(predicate).length;
const isStarted = record => Boolean(record.last || record.draft?.some(value => value.trim()));
const status = (set, record) => isComplete(set, record) ? 'Successful' : isStarted(record) ? 'In progress' : 'Not started';
const route = () => location.hash.slice(1) || 'home';

function updateStorageNotice() {
  const notice = document.querySelector('#storage-notice');
  if (notice) notice.hidden = persistent;
}

function refreshProfile() {
  const current = profiles.find(profile => profile.id === active) || guest;
  document.querySelector('#profile-summary').textContent = 'Profile · ' + current.name;
  profileSelect.replaceChildren(...profiles.map(profile => new Option(profile.name, profile.id)));
  profileSelect.value = active;
}

function selectProfile(id) {
  active = id;
  write(namespace + ':active', active);
  refreshProfile();
  profileMenu.open = false;
  document.querySelector('#profile-summary').focus();
  render(false);
}

profileSelect.addEventListener('change', () => selectProfile(profileSelect.value));
document.querySelector('#profile-form').addEventListener('submit', event => {
  event.preventDefault();
  const name = profileName.value.trim();
  if (!name) {
    profileMessage.textContent = 'Enter a profile name.';
    return;
  }
  if (profiles.some(profile => normalize(profile.name) === normalize(name))) {
    profileMessage.textContent = 'That profile already exists. Choose it above.';
    return;
  }
  const id = globalThis.crypto?.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2);
  profiles = [...profiles, {id, name}];
  write(namespace + ':profiles', profiles);
  profileName.value = '';
  profileMessage.textContent = '';
  selectProfile(id);
});

function homeView() {
  const completed = count(sets, set => isComplete(set));
  const recent = read(keyFor('recent'), '');
  return `
    <p class="eyebrow">Reading and Use of English · Part 3</p>
    <h1 tabindex="-1">Word formation</h1>
    <p class="intro">Choose a tier and a set. Use the word in capitals to form the word that fits each gap, then select <strong>Spell</strong> to check the set.</p>
    <div class="status-strip">
      <span><strong>${completed} of ${sets.length}</strong> sets successful</span>
      <span class="small">${Object.values(exercises).reduce((total, items) => total + items.length, 0).toLocaleString('en-GB')} practice sentences</span>
      ${exercises[recent] ? `<a class="button secondary" href="#set/${recent}">Return to ${recent}</a>` : ''}
    </div>
    <div class="grid tiers">${Object.entries(tiers).map(([prefix, tier]) => {
      const list = tierSets(prefix);
      return `<section class="card tier-card" style="--accent:${tier.color}">
        <h2><a href="#tier/${prefix}">${tier.title}</a></h2>
        <p class="small">${tier.description}</p>
        <p><strong>${count(list, set => isComplete(set))} / ${list.length}</strong> successful</p>
        <div class="quick" aria-label="Quick links to the first three sets">
          ${list.slice(0, 3).map(set => `<a href="#set/${set}">${set}</a>`).join('')}
        </div>
        <a class="button secondary" href="#tier/${prefix}">All ${tier.title.toLowerCase()} sets</a>
      </section>`;
    }).join('')}</div>`;
}

function tierView(prefix) {
  const tier = tiers[prefix];
  const list = tierSets(prefix);
  return `
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">All tiers</a> <span aria-hidden="true">/</span> <span aria-current="page">${tier.title}</span></nav>
    <p class="eyebrow">Practice tier</p>
    <h1 tabindex="-1">${tier.title} sets</h1>
    <p class="intro">${tier.description}</p>
    <div class="status-strip"><span><strong>${count(list, set => isComplete(set))} of ${list.length}</strong> sets successful</span></div>
    <div class="grid sets">${list.map(set => {
      const record = recordFor(set);
      const label = status(set, record);
      const style = isComplete(set, record) ? 'done' : isStarted(record) ? 'started' : '';
      return `<a class="card set-card" href="#set/${set}">
        <div class="set-heading"><h2>${set}</h2><span class="pill ${style}">${label}</span></div>
        <p class="small">${exercises[set].length} items${Number.isInteger(record.best) ? ` · Best ${record.best}/${exercises[set].length}` : ''}</p>
      </a>`;
    }).join('')}</div>`;
}

function setView(set) {
  const prefix = set[0];
  const tier = tiers[prefix];
  const items = exercises[set];
  const next = tierSets(prefix)[tierSets(prefix).indexOf(set) + 1];
  return `
    <nav class="crumbs" aria-label="Breadcrumb"><a href="#home">All tiers</a><span aria-hidden="true">/</span>
      <a href="#tier/${prefix}">${tier.title}</a><span aria-hidden="true">/</span><span aria-current="page">${set}</span></nav>
    <p class="eyebrow">${tier.title} tier · ${items.length} items</p>
    <h1 tabindex="-1">Set ${set}</h1>
    <p class="intro">Use the word in capitals to form one word that fits the gap. Select <strong>Spell</strong> to check your answers and see the corrections. Use <strong>Retry mistakes</strong> to practise only the items you missed.</p>
    <form id="exercise-form" autocomplete="off">
      <ol class="exercise">${items.map(([item, before, after, cue], index) => `
        <li class="question">
          <span class="item">${text(item)}</span>
          <div class="sentence">${text(before)}<input class="answer" type="text" id="answer-${index}" maxlength="70"
            aria-label="Item ${text(item)}. ${text(before)} blank ${text(after)}. Prompt ${cue}."
            aria-describedby="feedback-${index}" spellcheck="false" autocapitalize="off" autocorrect="off">${text(after)}
            <span class="feedback" id="feedback-${index}"></span></div>
          <span class="cue">${cue}</span>
        </li>`).join('')}</ol>
      <div class="checkbar">
        <div class="result" id="result" role="status" aria-live="polite"></div>
        <div class="check-actions"><button class="button" type="submit">Spell</button>
          <button class="button secondary" type="button" id="retry-mistakes" hidden>Retry mistakes</button>
          <button class="button secondary" type="button" id="clear-set" title="Clear this attempt and start the full set again">Clear</button>
          ${next ? `<a class="button secondary" href="#set/${next}">Next set</a>` : `<a class="button secondary" href="#tier/${prefix}">Tier overview</a>`}
        </div>
      </div>
    </form>`;
}

function bindSet(set) {
  const items = exercises[set];
  const form = document.querySelector('#exercise-form');
  const fields = [...form.querySelectorAll('input.answer')];
  const rows = [...form.querySelectorAll('.question')];
  const result = document.querySelector('#result');
  const retryButton = document.querySelector('#retry-mistakes');
  const clearButton = document.querySelector('#clear-set');
  const record = recordFor(set);
  write(keyFor('recent'), set);
  fields.forEach((field, index) => { field.value = record.draft?.[index] ?? ''; });

  const values = () => fields.map(field => field.value);
  const correct = (index, value) => items[index][4].some(answer => normalize(answer) === normalize(value));

  function showFeedback() {
    const retry = record.retry ? new Set(record.retry) : null;
    retryButton.hidden = !record.last || record.last.score === items.length || record.retryPending === true;
    fields.forEach((field, index) => {
      const visible = !retry || retry.has(index);
      rows[index].hidden = !visible;
      field.disabled = !visible;
      const feedback = rows[index].querySelector('.feedback');
      const checked = visible && !record.retryPending && record.last && normalize(record.last.answers[index] ?? '') === normalize(field.value);
      const outcome = !checked ? '' : !normalize(field.value) ? 'blank' : correct(index, field.value) ? 'correct' : 'incorrect';
      rows[index].dataset.status = outcome;
      const expected = items[index][4].join(' / ');
      if (outcome === 'incorrect') feedback.textContent = `Your answer: ${field.value.trim()} · Correct answer: ${expected}`;
      else if (outcome === 'blank') feedback.textContent = `Unanswered · Correct answer: ${expected}`;
      else feedback.textContent = outcome === 'correct' ? 'Correct' : '';
      if (outcome === 'incorrect' || outcome === 'blank') field.setAttribute('aria-invalid', 'true');
      else field.removeAttribute('aria-invalid');
    });
    if (record.retryPending) {
      result.textContent = `Retry round · ${retry.size} ${retry.size === 1 ? 'item' : 'items'}. Select Spell to check.`;
      return;
    }
    if (!record.last) {
      result.textContent = isComplete(set, record) ? 'New attempt · Best: successful' : 'Ready to check';
      return;
    }
    const changed = fields.some((field, index) => normalize(record.last.answers[index] ?? '') !== normalize(field.value));
    const score = `${record.last.score}/${items.length} correct`;
    if (changed) result.textContent = `Last check: ${score}. Select Spell to recheck.${isComplete(set, record) ? ' Best: successful.' : ''}`;
    else if (record.last.score === items.length) result.textContent = `${score} · Successful`;
    else result.textContent = `${score} · ${isComplete(set, record) ? 'Best: successful' : 'In progress'}`;
  }

  retryButton.addEventListener('click', () => {
    if (!record.last || record.retryPending) return;
    const previous = record.last.answers;
    const missed = fields.map((_, index) => index).filter(index => !correct(index, previous[index] ?? ''));
    if (!missed.length) return;
    const missedSet = new Set(missed);
    record.retry = missed;
    record.retryPending = true;
    fields.forEach((field, index) => { field.value = missedSet.has(index) ? '' : previous[index]; });
    record.draft = values();
    write(keyFor(set), record);
    showFeedback();
    fields[missed[0]].focus();
  });

  clearButton.addEventListener('click', () => {
    delete record.last;
    delete record.retry;
    delete record.retryPending;
    delete record.draft;
    fields.forEach(field => { field.value = ''; });
    write(keyFor(set), record);
    showFeedback();
    fields[0].focus();
  });

  form.addEventListener('input', () => {
    record.draft = values();
    write(keyFor(set), record);
    showFeedback();
  });
  form.addEventListener('submit', event => {
    event.preventDefault();
    const answers = values();
    const score = answers.reduce((sum, value, index) => sum + Number(correct(index, value)), 0);
    record.draft = answers;
    record.last = {answers, score};
    record.retryPending = false;
    if (score === items.length) delete record.retry;
    record.best = Math.max(record.best ?? 0, recordFor(set).best ?? 0, score);
    write(keyFor(set), record);
    showFeedback();
  });
  showFeedback();
}

function render(focus = true) {
  const [page, id] = route().split('/');
  const validSet = page === 'set' && Object.hasOwn(exercises, id);
  const validTier = page === 'tier' && Object.hasOwn(tiers, id);
  app.innerHTML = (validSet ? setView(id) : validTier ? tierView(id) : homeView()) +
    '<p class="notice" id="storage-notice" role="status" hidden>Browser storage is unavailable. Progress will last only until this tab is closed or reloaded.</p>';
  if (validSet) bindSet(id);
  updateStorageNotice();
  document.title = validSet ? `${id} · Word Formation Practice` : validTier ? `${tiers[id].title} · Word Formation Practice` : 'Word Formation Practice';
  if (focus) {
    window.scrollTo(0, 0);
    app.querySelector('h1').focus({preventScroll:true});
  }
}

window.addEventListener('hashchange', () => { profileMenu.open = false; render(); });
refreshProfile();
render(false);
</script>
</body>
</html>
